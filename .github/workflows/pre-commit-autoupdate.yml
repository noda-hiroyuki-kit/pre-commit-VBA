---
name: pre-commit autoupdate

"on":
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Update pre-commit hooks
        run: uv run prek update --cooldown-days 10

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: pre-commit autoupdate"
          title: "chore: pre-commit autoupdate"
          body: |
            Automated update of `.pre-commit-config.yaml` by GitHub Actions.

            - Ran `uv run prek update --cooldown-days 10`
            - Schedule: every Friday 18:00 Asia/Tokyo
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          add-paths: |
            .pre-commit-config.yaml
